name: Windows build

on:
  push:
    branches: [ main, linux-port ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Release)
        run: cmake --preset release

      - name: Build (all targets)
        run: cmake --build build/release --config Release
